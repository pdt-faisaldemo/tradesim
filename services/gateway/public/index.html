<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TradeSim</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Cpath d='M6 22l7-8 5 5 8-10' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/dashboard"><span class="logo" aria-hidden="true"></span>TradeSim</a>
      <nav id="nav" aria-label="Main">
        <a href="#/dashboard" data-page="dashboard">Dashboard</a>
        <a href="#/trade" data-page="trade">Trade</a>
        <a href="#/portfolio" data-page="portfolio">Portfolio</a>
      </nav>
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle light/dark mode" title="Toggle light/dark mode">&#9680;</button>
    </div>
  </header>

  <div id="banner" class="banner" role="status" hidden>Trading is degraded. We're working on it.</div>

  <main id="app" aria-live="polite"></main>

  <footer class="footer">
    <div id="health-strip" class="health-strip" aria-label="Service health"></div>
    <div class="sim-note">Simulated market data. Not real prices and not investment advice.</div>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
