# Jobs are immutable: delete before re-applying (bootstrap.sh and reset.sh do).
apiVersion: v1
kind: ConfigMap
metadata:
  name: tradesim-seed-sql
  namespace: tradesim
data:
  seed.sql: |
    CREATE TABLE IF NOT EXISTS accounts (
      id         text PRIMARY KEY,
      name       text NOT NULL,
      cash       numeric(14,2) NOT NULL CHECK (cash >= 0),
      updated_at timestamptz NOT NULL DEFAULT now()
    );
    INSERT INTO accounts (id, name, cash) VALUES ('c-1001', 'Jordan Lee', 41870.00)
    ON CONFLICT (id) DO UPDATE SET name = EXCLUDED.name, cash = EXCLUDED.cash, updated_at = now();

    CREATE TABLE IF NOT EXISTS orders (
      id          text PRIMARY KEY,
      customer_id text NOT NULL,
      symbol      text NOT NULL,
      qty         integer NOT NULL CHECK (qty > 0),
      price       numeric(14,2) NOT NULL,
      cost        numeric(14,2) NOT NULL,
      created_at  timestamptz NOT NULL DEFAULT now()
    );
    CREATE INDEX IF NOT EXISTS orders_customer_created ON orders (customer_id, created_at DESC);
    CREATE TABLE IF NOT EXISTS positions (
      customer_id text NOT NULL,
      symbol      text NOT NULL,
      qty         integer NOT NULL CHECK (qty > 0),
      avg_cost    numeric(14,4) NOT NULL,
      PRIMARY KEY (customer_id, symbol)
    );
    -- Synthetic customers for loadgen. Separate from c-1001 so background traffic never drains the demo
    -- customer's cash; their balance is large enough to run for days.
    INSERT INTO accounts (id, name, cash) VALUES
      ('c-2001', 'Load Customer 1', 1000000000.00),
      ('c-2002', 'Load Customer 2', 1000000000.00),
      ('c-2003', 'Load Customer 3', 1000000000.00),
      ('c-2004', 'Load Customer 4', 1000000000.00),
      ('c-2005', 'Load Customer 5', 1000000000.00)
    ON CONFLICT (id) DO UPDATE SET name = EXCLUDED.name, cash = EXCLUDED.cash, updated_at = now();
    -- Reset state, then c-1001's starting book: 10 positions and the 10 filled orders that built them, spread over
    -- the last 5 days. Cash stays 41870.00 (the history is illustrative, not replayed against the balance).
    TRUNCATE orders;
    DELETE FROM positions;
    CREATE TEMP TABLE seed_trades (n int, symbol text, qty int, price numeric(14,2), hours_ago int);
    INSERT INTO seed_trades VALUES
      (1,  'NVDA', 40, 162.50, 118),
      (2,  'AMZN', 25, 205.10, 101),
      (3,  'ANTH', 15, 280.00,  87),
      (4,  'META',  8, 655.30,  73),
      (5,  'AMD',  30, 141.75,  58),
      (6,  'CRWD',  6, 432.90,  46),
      (7,  'PANW', 20, 188.40,  33),
      (8,  'SNOW', 12, 198.60,  22),
      (9,  'ANET', 35, 128.20,  11),
      (10, 'NBIS', 50,  84.10,   3);
    INSERT INTO orders (id, customer_id, symbol, qty, price, cost, created_at)
      SELECT 'o-seed' || lpad(n::text, 4, '0'), 'c-1001', symbol, qty, price, qty * price,
             now() - make_interval(hours => hours_ago, mins => (n * 7) % 50)
      FROM seed_trades;
    INSERT INTO positions (customer_id, symbol, qty, avg_cost)
      SELECT 'c-1001', symbol, qty, price FROM seed_trades;
---
apiVersion: batch/v1
kind: Job
metadata:
  name: seed
  namespace: tradesim
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seed
          image: postgres:16-alpine
          command: ["sh", "-c"]
          args:
            - |
              until pg_isready -h postgres -U tradesim -d tradesim; do echo "waiting for postgres"; sleep 2; done
              psql -v ON_ERROR_STOP=1 -h postgres -U tradesim -d tradesim -f /seed/seed.sql
              echo "seed complete"
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: tradesim-secrets, key: DB_PASSWORD}
          volumeMounts:
            - {name: seed, mountPath: /seed}
      volumes:
        - name: seed
          configMap: {name: tradesim-seed-sql}
