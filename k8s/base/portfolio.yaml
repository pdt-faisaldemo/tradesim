apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio
  namespace: tradesim
  labels: {app: portfolio}
spec:
  replicas: 1
  selector:
    matchLabels: {app: portfolio}
  template:
    metadata:
      labels: {app: portfolio}
    spec:
      containers:
        - name: portfolio
          image: ghcr.io/pdt-faisaldemo/tradesim-portfolio:v1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8084
          envFrom:
            - configMapRef: {name: tradesim-portfolio-config}
          env:
            - {name: DB_USER, value: tradesim}
            - {name: DB_NAME, value: tradesim}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: tradesim-secrets, key: DB_PASSWORD}
          # TCP only on purpose: gating readiness on /health would pull the pod out of the Service
          # and hide the very symptoms the demo is about.
          readinessProbe:
            tcpSocket: {port: 8084}
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio
  namespace: tradesim
spec:
  selector: {app: portfolio}
  ports:
    - {port: 8084, targetPort: 8084}
