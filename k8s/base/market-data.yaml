apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-data
  namespace: tradesim
  labels: {app: market-data}
spec:
  replicas: 1
  selector:
    matchLabels: {app: market-data}
  template:
    metadata:
      labels: {app: market-data}
    spec:
      containers:
        - name: market-data
          image: ghcr.io/pdt-faisaldemo/tradesim-market-data:v1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8085
          envFrom:
            - configMapRef: {name: tradesim-market-data-config}
          # TCP only on purpose: gating readiness on /health would pull the pod out of the Service
          # and hide the very symptoms the demo is about.
          readinessProbe:
            tcpSocket: {port: 8085}
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: market-data
  namespace: tradesim
spec:
  selector: {app: market-data}
  ports:
    - {port: 8085, targetPort: 8085}
