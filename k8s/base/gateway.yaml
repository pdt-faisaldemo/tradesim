apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: tradesim
  labels: {app: gateway}
spec:
  replicas: 1
  selector:
    matchLabels: {app: gateway}
  template:
    metadata:
      labels: {app: gateway}
    spec:
      containers:
        - name: gateway
          image: ghcr.io/pdt-faisaldemo/tradesim-gateway:v1.0.0-ui4
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: {name: tradesim-gateway-config}
          # Optional: without them the incident panel falls back to the health summary.
          env:
            - name: PD_API_TOKEN
              valueFrom:
                secretKeyRef: {name: tradesim-secrets, key: PD_API_TOKEN, optional: true}
            - name: PD_SERVICE_IDS
              valueFrom:
                secretKeyRef: {name: tradesim-secrets, key: PD_SERVICE_IDS, optional: true}
          # TCP only on purpose: gating readiness on /health would pull the pod out of the Service
          # and hide the very symptoms the demo is about.
          readinessProbe:
            tcpSocket: {port: 8080}
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: tradesim
spec:
  selector: {app: gateway}
  ports:
    - {port: 8080, targetPort: 8080}
