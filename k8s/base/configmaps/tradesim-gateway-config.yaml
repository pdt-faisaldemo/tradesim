  CHAOS_URL: "http://chaos-api.platform:8090"
  REVENUE_AT_RISK_PER_S: "500"
  ENGINEER_HOURLY_RATE: "150"
  DEFAULT_ENGINEERS: "1"
  TYPICAL_COMPARISON: "6 engineers · 45+ min · $680"
