name: build-image

# Manual only. Example: service=account git_ref=main tag=v1.0.0
on:
  workflow_dispatch:
    inputs:
      service:
        description: "Service folder name (account, risk, order, portfolio, market-data, gateway, alert-bridge, chaos-api, loadgen)"
        required: true
        type: string
      git_ref:
        description: "Branch, tag or SHA to build"
        required: true
        default: main
        type: string
      tag:
        description: "Image tag, e.g. v1.0.0"
        required: true
        default: v1.0.0
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - name: Locate Dockerfile
        id: loc
        run: |
          svc="${{ inputs.service }}"
          if [ -f "services/$svc/Dockerfile" ]; then echo "file=services/$svc/Dockerfile" >> "$GITHUB_OUTPUT"
          elif [ -f "platform/$svc/Dockerfile" ]; then echo "file=platform/$svc/Dockerfile" >> "$GITHUB_OUTPUT"
          else echo "No Dockerfile for service '$svc' at ref ${{ inputs.git_ref }}" >&2; exit 1; fi
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.loc.outputs.file }}
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ inputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: ghcr.io/${{ steps.loc.outputs.owner }}/tradesim-${{ inputs.service }}:${{ inputs.tag }}

      - name: Summary
        run: echo "Pushed ghcr.io/${{ steps.loc.outputs.owner }}/tradesim-${{ inputs.service }}:${{ inputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
