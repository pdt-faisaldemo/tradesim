<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>TradeSim ops</title>
<style>
  :root { --bg:#f4f6fa; --surface:#fff; --text:#0f1b2d; --muted:#5b6b82; --border:#d9e0ea; --accent:#2563eb; --up:#0f8a4b; --down:#d12f3b; --warn:#b7791f; --btn:#eef2f8; --pre:#0b1220; --pre-text:#d6e2f5; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b1220; --surface:#131c2e; --text:#e6edf8; --muted:#97a6bd; --border:#27344d; --accent:#6ea0ff; --up:#37c47a; --down:#ff6b78; --warn:#e0a94a; --btn:#1b2740; --pre:#060b14; --pre-text:#cfe0f7; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 12px 12px 40px; display: grid; gap: 12px; }
  h1 { font-size: 1.15rem; margin: 0; }
  h2 { font-size: .75rem; margin: 0 0 8px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px; min-width: 0; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .chip { display: inline-block; padding: .2rem .7rem; border-radius: 999px; font-weight: 700; font-size: .8rem; letter-spacing: .04em; background: var(--btn); color: var(--muted); }
  .chip.incident, .chip.fixing { background: var(--down); color: #fff; }
  .chip.fixing { background: var(--warn); }
  .chip.resolved { background: var(--up); color: #fff; }
  .row { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
  .kv { color: var(--muted); font-size: .9rem; } .kv b { color: var(--text); }
  .dots { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; }
  .svc { display: inline-flex; align-items: center; gap: 6px; font-size: .9rem; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #9aa6b5; display: inline-block; }
  .dot.ok { background: var(--up); } .dot.bad { background: var(--down); box-shadow: 0 0 0 3px color-mix(in srgb, var(--down) 25%, transparent); }
  .alerts { margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: .88rem; }
  .alerts li { padding: 6px 8px; border-radius: 8px; background: color-mix(in srgb, var(--down) 10%, var(--surface)); border: 1px solid color-mix(in srgb, var(--down) 30%, var(--border)); overflow-wrap: anywhere; }
  .alerts li.warning { background: color-mix(in srgb, var(--warn) 12%, var(--surface)); border-color: color-mix(in srgb, var(--warn) 35%, var(--border)); }
  .none { color: var(--muted); font-size: .9rem; }
  a { color: var(--accent); }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .seg button { border: 0; background: var(--btn); color: var(--text); padding: 10px 18px; font: inherit; font-weight: 600; cursor: pointer; min-height: 44px; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
  button.big { text-align: left; border: 1px solid var(--border); background: var(--btn); color: var(--text); border-radius: 12px; padding: 12px 14px; font: inherit; cursor: pointer; min-height: 84px; display: grid; gap: 2px; align-content: start; }
  button.big strong { font-size: 1.25rem; letter-spacing: .02em; }
  button.big span { color: var(--muted); font-size: .85rem; line-height: 1.3; }
  button.big:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  button.act { border: 0; border-radius: 12px; padding: 14px; font: inherit; font-weight: 800; letter-spacing: .04em; font-size: 1rem; color: #fff; cursor: pointer; min-height: 56px; }
  button.act.fix { background: var(--up); } button.act.clear { background: var(--accent); } button.act.reset { background: var(--down); }
  .msg { min-height: 1.3em; margin-top: 8px; font-size: .9rem; color: var(--down); }
  pre { margin: 0; background: var(--pre); color: var(--pre-text); border-radius: 10px; padding: 10px; font: 12.5px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; max-height: 340px; min-height: 90px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
  .runline { font-size: .85rem; color: var(--muted); margin-bottom: 6px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>TradeSim ops</h1>
    <span id="phase" class="chip">…</span>
  </header>

  <section class="card" aria-label="Live status">
    <h2>Live status</h2>
    <div class="row">
      <span class="kv">Scenario <b id="scn">none</b></span>
      <span class="kv">Mode <b id="mode">-</b></span>
      <span class="kv">Elapsed <b id="elapsed">-</b></span>
      <span class="kv" id="incident"></span>
    </div>
    <div class="dots" id="dots"></div>
    <h2 style="margin-top:12px">Open alerts <span id="alertcount"></span></h2>
    <ul class="alerts" id="alerts"></ul>
  </section>

  <section class="card" aria-label="Scenarios">
    <div class="row" style="justify-content:space-between; margin-bottom:10px">
      <h2 style="margin:0">Scenarios</h2>
      <div class="seg" role="group" aria-label="Mode">
        <button type="button" id="m-quick" aria-pressed="true">Quick</button>
        <button type="button" id="m-deep" aria-pressed="false">Deep</button>
      </div>
    </div>
    <div class="grid" id="scenarios"></div>
  </section>

  <section class="card" aria-label="Actions">
    <div class="actions">
      <button type="button" class="act fix" id="fix">FIX <span id="fixname"></span></button>
      <button type="button" class="act clear" id="clear">CLEAR STORY</button>
      <button type="button" class="act reset" id="reset">RESET ALL</button>
    </div>
    <div class="msg" id="msg" role="alert"></div>
  </section>

  <section class="card" aria-label="Script output">
    <h2>Last script output</h2>
    <div class="runline" id="runline">nothing run yet</div>
    <pre id="out"></pre>
  </section>
</main>
<script>
'use strict';
const SCENARIOS = [
  ['S1', 'Bad risk check deployed: valid orders get rejected'],
  ['S1R', 'S1 again (repeat incident): fixed by the known v1.0.2'],
  ['S2', 'DB pool shrunk to 1 after a decoy change: account fails, five services cascade'],
  ['S3', 'Price feed silently frozen: no errors, stale prices'],
  ['S4', 'Portfolio memory leak: slowdown, then OOM restarts'],
  ['S4R', 'S4 again (repeat incident): fixed by the known v1.0.2'],
  ['S5', 'Typo in the account DB host: CrashLoopBackOff, everything downstream fails'],
  ['COMBO', 'S3 + S4 together: stale prices and a leaking portfolio'],
];
const $ = (id) => document.getElementById(id);
const mmss = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
let mode = 'quick';
let status = null;
let offset = 0;
let outId = 0;
let polling = false;

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) { if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (v != null) e.setAttribute(k, v); }
  e.append(...kids.filter((x) => x != null));
  return e;
}

for (const [id, desc] of SCENARIOS) {
  $('scenarios').append(el('button', { type: 'button', class: 'big', 'data-id': id, onclick: () => act('scenario', { scenario: id, mode }) }, el('strong', {}, id), el('span', {}, desc)));
}
function setMode(m) {
  mode = m;
  $('m-quick').setAttribute('aria-pressed', String(m === 'quick'));
  $('m-deep').setAttribute('aria-pressed', String(m === 'deep'));
}
$('m-quick').onclick = () => setMode('quick');
$('m-deep').onclick = () => setMode('deep');
$('fix').onclick = () => act('fix');
$('clear').onclick = () => act('clear-story');
$('reset').onclick = () => { if (confirm('Reset everything to baseline? This stops any running script.')) act('reset'); };

async function act(action, body) {
  $('msg').textContent = '';
  try {
    const r = await fetch(`/ops/api/${action}`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body || {}) });
    const b = await r.json().catch(() => ({}));
    if (!r.ok) $('msg').textContent = b.error || `request failed (${r.status})`;
    else { offset = 0; outId = 0; $('out').textContent = ''; }
  } catch (err) {
    $('msg').textContent = `request failed: ${err.message}`;
  }
  await refresh();
  pollOutput();
}

function paint() {
  const s = status;
  if (!s) return;
  const phase = s.resetting ? 'resetting' : s.story.phase;
  $('phase').textContent = phase.toUpperCase();
  $('phase').className = `chip ${phase}`;
  $('scn').textContent = s.story.scenario || 'none';
  $('mode').textContent = s.story.mode || '-';
  const t = s.story.detectedAt ? ((s.story.resolvedAt || s.serverNow) - s.story.detectedAt) / 1000 : null;
  $('elapsed').textContent = t === null ? (s.story.phase === 'incident' ? 'investigating' : '-') : mmss(t);
  $('incident').replaceChildren(...(s.incident && s.incident.url
    ? ['PagerDuty ', el('a', { href: s.incident.url, target: '_blank', rel: 'noopener noreferrer' }, `#${s.incident.number} ${s.incident.status}`)]
    : []));
  $('dots').replaceChildren(...s.services.map((v) => el('span', { class: 'svc', title: v.reason || 'healthy' }, el('span', { class: `dot ${v.healthy ? 'ok' : 'bad'}` }), v.name)));
  const open = (s.alerts && s.alerts.open) || [];
  $('alertcount').textContent = s.alerts && s.alerts.ok ? `(${open.length}${s.alerts.dryRun ? ', dry run' : ''})` : '(alert-bridge unreachable)';
  $('alerts').replaceChildren(...(open.length ? open.map((a) => el('li', { class: a.severity }, el('b', {}, a.dedup_key), ` ${a.summary}`)) : [el('li', { class: 'none', style: 'background:none;border:0;padding:0' }, 'none')]));
  const a = s.allowed;
  document.querySelectorAll('button.big').forEach((b) => { b.disabled = !a.scenario; });
  $('fix').disabled = !a.fix;
  $('fixname').textContent = a.fix && s.story.scenario ? `(${s.story.scenario})` : '';
  $('clear').disabled = !a.clearStory;
  $('reset').disabled = !a.reset;
}

async function refresh() {
  try {
    const r = await fetch('/ops/api/status', { cache: 'no-store' });
    if (r.status === 401) { location.reload(); return; }
    status = await r.json();
    paint();
  } catch { /* keep the last picture */ }
}

async function pollOutput() {
  if (polling) return;
  polling = true;
  try {
    for (;;) {
      const r = await fetch(`/ops/api/output?from=${outId === 0 ? 0 : offset}`, { cache: 'no-store' });
      const o = await r.json();
      if (o.id !== outId) { outId = o.id; offset = 0; $('out').textContent = ''; }
      if (o.text) {
        const pre = $('out');
        const stick = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 30;
        pre.textContent += o.text;
        if (stick) pre.scrollTop = pre.scrollHeight;
      }
      offset = o.total;
      $('runline').textContent = !o.id ? 'nothing run yet' : o.running ? `running: ${o.label}` : `${o.label}: finished, exit code ${o.exitCode}`;
      if (!o.running) break;
      await new Promise((res) => setTimeout(res, 1000));
    }
  } catch { /* try again on the next status refresh */ } finally { polling = false; }
}

refresh().then(pollOutput);
setInterval(() => { refresh(); if (status && status.run && status.run.running) pollOutput(); }, 2000);
</script>
</body>
</html>
